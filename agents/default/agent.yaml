# Agent definition: static state, loaded fresh at every run.
#
# Python (evolving_harness/agent.py) is the frozen runtime.
# This file is the mutable state. During RSI only the blocks marked
# "mutable" may change; everything else is pinned for the experiment.
version: 1
name: default

# Frozen runtime. Environment references keep secrets out of state.
model:
  id: ${EH_MODEL}
  base_url: ${EH_BASE_URL}
  temperature: 0.2
  max_tokens: 2048

limits:
  max_steps: 20
  # Rough len/4 estimate. Over budget, older tool results are truncated and then
  # the oldest rounds dropped; the most recent rounds stay verbatim.
  max_context_tokens: 32000
  keep_recent_rounds: 6

prompt:
  # Frozen: the harness contract.
  system: |
    You are an agent running inside a harness.
    - Act only through the provided tools; all paths are relative to the workspace.
    - Take one step at a time and treat tool results as evidence.
    - When the task is done, reply with the final answer and no tool calls.

  # Mutable by RSI.
  guidance: |
    - Inspect the workspace before writing.
    - After writing, re-read the result and compare it with the task.

# Frozen tool surface. load_skill is added automatically when skills exist.
tools:
  enabled: [read_file, write_file, list_dir, bash]

# Mutable by RSI. Long-term goals, persistent across runs (not per-trigger input).
# Injected into the system prompt at run start; not re-written per step.
goals:
  - id: goal-default
    statement: Answer the user's task in the workspace, treating tool results as evidence.
    priority: 1

# Mutable by RSI. Write policy for the file memory (content lives in <workspace>/.memory/notes.md).
memory:
  enabled: false
  path: .memory/notes.md
  max_tokens: 1024        # injection cap; summary first, then most recent notes

# Mutable by RSI. Bodies are loaded on demand through load_skill.
skills:
  - name: inspect-first
    description: Read the workspace before making changes.
    instructions: |
      1. List the workspace.
      2. Read every file you plan to modify.
      3. Then make the smallest change that satisfies the task.
