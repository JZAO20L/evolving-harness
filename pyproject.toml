[project]
name = "evolving-harness"
version = "0.1.0"
description = "An agent harness that evolves its own skills."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "openai>=1.40,<3",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.115",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "uvicorn>=0.30",
    "websockets>=12",
]
frontend = [
    "gradio>=4.44",
    "websockets>=12",
]

[project.scripts]
eh = "evolving_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evolving_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "smoke: L1 冒烟——打真模型(deepseek/ARK)，需 EH_SMOKE=1 + ARK_API_KEY，离线默认跳过",
]

[tool.ruff]
line-length = 100
target-version = "py311"
